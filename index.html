<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020b08">
  <meta name="description" content="Ralph Leo — Lead Product Designer and UI/UX Designer based in Chennai, India.">
  <title>Ralph Leo — Lead Product Designer</title>
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <main class="hero" id="top">
    <video class="hero-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
      <source src="./assets/hero-video.mp4" type="video/mp4">
    </video>
    <div class="video-tint" aria-hidden="true"></div>
    <div class="video-vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="#top" aria-label="Ralph Leo home">
        <img src="./assets/RL-Logo-header.svg" alt="Ralph Leo">
      </a>
      <nav aria-label="Primary navigation">
        <a href="#work" class="active">Work</a>
        <a href="./resume.pdf">Resume</a>
      </nav>
    </header>

    <section class="hero-frame" aria-labelledby="hero-title">
      <span class="corner c-tl" aria-hidden="true"></span>
      <span class="corner c-tr" aria-hidden="true"></span>
      <span class="corner c-bl" aria-hidden="true"></span>
      <span class="corner c-br" aria-hidden="true"></span>

      <div class="hero-content">
        <p class="eyebrow">LEAD PRODUCT DESIGNER</p>
        <h1 id="hero-title">Ralph Leo</h1>
        <p class="intro">9+ years designing enterprise, e-commerce and digital experiences — turning complex business requirements into scalable products, workflows and design systems.</p>
      </div>

      <div class="frame-meta location">
        <span class="meta-dot"></span>
        <span>Chennai, India</span>
      </div>

      <a class="frame-meta scroll" href="#work" aria-label="Scroll to work">
        <span>SCROLL</span>
        <span class="arrow">↓</span>
      </a>
    </section>
  </main>

  <section id="work" class="work-placeholder">
    <div class="work-inner">
      <span class="section-label">SELECTED WORK</span>
      <h2>Selected work<br>coming next.</h2>
    </div>
  </section>
</body>
</html>
